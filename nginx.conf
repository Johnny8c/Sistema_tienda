# Sistema_tienda — config nginx base.
# Este archivo describe SOLO el bloque HTTP. Certbot agrega automaticamente el
# bloque 443 con SSL y la redireccion 80->443 cuando se corre:
#   sudo certbot --nginx -d nrboutique.ec -d www.nrboutique.ec
#
# Instalacion en el EC2 (primera vez):
#   sudo cp nginx.conf /etc/nginx/sites-available/sistema-tienda
#   sudo ln -s /etc/nginx/sites-available/sistema-tienda \
#              /etc/nginx/sites-enabled/sistema-tienda
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Si el dominio cambia, actualizar server_name aqui y re-correr certbot.

server {
    listen 80;
    server_name nrboutique.ec www.nrboutique.ec;

    client_max_body_size 10M;
    keepalive_timeout 65;

    # Headers de seguridad basicos (HSTS lo agrega Django cuando BEHIND_HTTPS=True)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy a gunicorn en Docker (127.0.0.1:8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
