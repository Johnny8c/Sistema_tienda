# Sistema_tienda — config nginx inicial sin SSL (mientras no haya dominio).
# Cuando se compre el dominio: agregar bloque 443 con certificados de
# Let's Encrypt (Certbot) y redirigir 80 → 443. Mismo patrón que systemdent.
#
# Instalación en el EC2:
#   sudo cp nginx.conf /etc/nginx/sites-available/sistema-tienda
#   sudo ln -s /etc/nginx/sites-available/sistema-tienda \
#              /etc/nginx/sites-enabled/sistema-tienda
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10M;
    keepalive_timeout 65;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy a gunicorn en Docker (127.0.0.1:8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
