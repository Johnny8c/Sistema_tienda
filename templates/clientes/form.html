{% extends 'base.html' %}
{% block title %}{{ accion }} cliente{% endblock %}
{% block nav_clientes %}active{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{% url 'lista_clientes' %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left"></i></a>
  <h4 class="fw-bold mb-0">{{ accion }} cliente</h4>
</div>

<div class="card border-0 shadow-sm" style="max-width:560px">
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Nombre completo <span class="text-danger">*</span></label>
        <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre|default:'' }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Cédula o RUC <span class="text-danger">*</span></label>
        {% if cliente %}
          <input type="text" class="form-control bg-light" value="{{ cliente.cedula_ruc }}" disabled>
          <div class="form-text">La cédula/RUC no se puede modificar.</div>
        {% else %}
          <input type="text" name="cedula_ruc" class="form-control" maxlength="13" placeholder="10 dígitos (cédula) o 13 (RUC)" required>
        {% endif %}
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Teléfono</label>
        <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono|default:'' }}">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" name="email" class="form-control" value="{{ cliente.email|default:'' }}">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Dirección</label>
        <textarea name="direccion" class="form-control" rows="2">{{ cliente.direccion|default:'' }}</textarea>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-dark">{{ accion }}</button>
        <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
